# =============================================================================
#  Satisfactory recipe & building data  --  EDIT THIS FILE to add recipes.
# =============================================================================
#
#  This is the ONLY file you need to touch as you unlock new recipes.
#  Everything the planner knows comes from here.
#
#  Each recipe has:
#     name    : what you call it (must be unique)
#     class   : the save-file recipe id (Recipe_*_C) so the save reader can map
#               a machine's recipe to this entry. Omit for recipes not in-game yet.
#     building: which machine makes it (must match a name under `buildings:`)
#     inputs  : {item: quantity_per_craft}
#     outputs : {item: quantity_per_craft}
#     time    : seconds for one craft
#     alt     : true if it's an Alternate recipe, false for the standard one
#
#  The planner turns "quantity per craft" + "time" into items/minute for you:
#     rate_per_minute = quantity * 60 / time
#
#  Raw resources (Iron Ore, Copper Ore, Coal, Limestone, Leaves, ...) are
#  anything used as an input but with no recipe of its own. Don't list them.
# =============================================================================

# ---- Machines and their base power draw, in MW (megawatts) at 100% clock ----
buildings:
  Smelter: 4
  Foundry: 16
  Constructor: 4
  Assembler: 15
  Manufacturer: 55
  Refinery: 30
  Packager: 10
  Blender: 75
  Particle Accelerator: 1000   # variable 500-1500 MW; representative value
  Converter: 250               # variable 100-400 MW; representative value
  Quantum Encoder: 1000        # variable 0-2000 MW; representative value
  Miner Mk.1: 5
  Miner Mk.2: 12
  Miner Mk.3: 30
  Water Extractor: 20

# ---- Items always treated as RAW (supplied by extractors), even if a recipe
#      makes them as a byproduct -- so they aren't flagged as false bottlenecks.
raw_items:
  - Water
  - Nitrogen Gas   # from Resource Wells (not a recipe machine); Unpackage Nitrogen also "makes" it, so pin raw

# ---- Recipes ----
